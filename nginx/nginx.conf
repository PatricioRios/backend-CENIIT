worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 20m;

    server {
        listen 80;

        # Use Docker's internal DNS resolver for service discovery
        resolver 127.0.0.11 valid=10s;


        # Route for Minio Console
        location /minio/console/ {
            proxy_pass http://minio:9001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            sub_filter '="/' '="/minio/console/';
            sub_filter_once off;
        }

        # Route for Minio API
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route for media resources
        location /media/recursos/ {
            proxy_pass http://minio:9000/recursos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- INICIO DE CAMBIOS SOLICITADOS ---

        # Regla consolidada para todo el servicio backend
        location /api/backend/ {
            proxy_pass http://auth-service:8081/api/backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Regla de redirección para corregir el path de Swagger del servicio de recursos
        location = /swagger/ {
            return 301 /api/resources/swagger/;
        }

        # Regla principal para la documentación de Swagger del servicio de recursos (Go)
        location /api/resources/swagger/ {
            proxy_pass http://resources-service:8082/api/resources/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Interceptar redirects internos y corregir la ubicación
            proxy_redirect /swagger/ /api/resources/swagger/;
            proxy_redirect /api/resources/swagger/index.html /api/resources/swagger/index.html;
            
            # Reescribir contenido HTML/JS/CSS para corregir rutas
            sub_filter_types text/html text/css text/javascript application/javascript application/json;
            sub_filter '="/swagger/' '="/api/resources/swagger/';
            sub_filter 'href="./swagger-ui.css"' 'href="/api/resources/swagger/swagger-ui.css"';
            sub_filter 'src="./swagger-ui-bundle.js"' 'src="/api/resources/swagger/swagger-ui-bundle.js"';
            sub_filter 'src="./swagger-ui-standalone-preset.js"' 'src="/api/resources/swagger/swagger-ui-standalone-preset.js"';
            sub_filter 'url: "./doc.json"' 'url: "/api/resources/swagger/doc.json"';
            sub_filter 'url: "/swagger/doc.json"' 'url: "/api/resources/swagger/doc.json"';
            sub_filter_once off;
        }
        # --- FIN DE CAMBIOS SOLICITADOS ---

        # Route for Keycloak (Debe ir al final)
        location / {
            proxy_pass http://keycloak:8080/;
            proxy_set_header Host keycloak.local:3030;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}
