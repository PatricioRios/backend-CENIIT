# docker-compose.yml
#version: "3.8"

services:
  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - trabajo_final_keycloak_db_data:/var/lib/postgresql/data
    networks:
      - app-network
  
  minio-setup:
    build:
      context: ./minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.1
    container_name: keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: mysecretpassword
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak.local
      KC_HOSTNAME_URL: http://keycloak.local:3030
      KC_HOSTNAME_ADMIN_URL: http://keycloak.local:3030
      KC_PROXY: edge
      KC_HTTP_ENABLED: true
    ports:
      - "3030:8080"
    depends_on:
      - keycloak-postgres
    networks:
      - app-network
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak-data/import:/opt/keycloak/data/import


  app-postgres:
    image: postgres:16
    container_name: app-postgres
    restart: unless-stopped
    environment:
      #POSTGRES_DB: app_db <- se inicializa en el "- ./init-app-postgres-db:/docker-entrypoint-initdb.d"
      #POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - trabajo_final_app_db_data:/var/lib/postgresql/data
      - ./init-app-postgres-db:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio-server
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminsecret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  auth-service:
    build:
      context: ./backend
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      app-postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - app-network
    extra_hosts:
      - "keycloak.local:host-gateway"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://app-postgres:5432/app_db
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_password
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak.local:3030/realms/develop-spring-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak.local:3030/realms/develop-spring-realm/protocol/openid-connect/certs
      - KEYCLOAK_PROVIDER_CONFIG_SERVER_URL=http://keycloak.local:3030

  resources-service:
    build:
      context: ./resources-service
    container_name: resources-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      minio:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - app-network
    extra_hosts:
      - "keycloak.local:host-gateway"
    environment:
      - SWAGGER_ENABLED=true
      - APP_NAME=resources-service
      - APP_VERSION=1.0.0
      - HTTP_PORT=8082
      - LOG_LEVEL=debug
      - PG_POOL_MAX=10
      - PG_URL=postgres://app_user:app_password@app-postgres:5432/app_db?sslmode=disable
      - KEYCLOAK_ISSUER_URL=http://keycloak.local:3030/realms/develop-spring-realm
      - KEYCLOAK_JWKS_URL=http://keycloak.local:3030/realms/develop-spring-realm/protocol/openid-connect/certs
      - KEYCLOAK_CLIENT_ID=backend-recursos
      - KEYCLOAK_CLIENT_SECRET=GdLt1pXeZRogkLal1HzJ8t0CsONHv0dG
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY_ID=minioadmin
      - MINIO_SECRET_ACCESS_KEY=minioadminsecret
      - MINIO_BUCKET_NAME=recursos

  nginx:
    image: nginx:1.27.0-alpine
    container_name: nginx-proxy
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - resources-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  trabajo_final_keycloak_db_data:
  trabajo_final_app_db_data:
